<div class="catalogo">
  <div class="header-catalogo">
    <h1>{{ categoriaNombre() }}</h1>
    <p>Explora todos nuestros productos de esta categoría</p>
  </div>

  <div class="filtros">
    <input
      type="text"
      [(ngModel)]="busqueda"
      placeholder="Buscar productos..."
      class="input-busqueda"
    />
  </div>

  <div class="productos-grid">
    @if (productosFiltrados().length > 0) {
      @for (producto of productosFiltrados(); track producto.id) {
        <app-card-producto-carrito [producto]="producto"></app-card-producto-carrito>
      }
    } @else {
      <div class="sin-resultados">
        <p>No hay productos disponibles en esta categoría</p>
      </div>
    }
  </div>

  <p class="total-productos">
    Mostrando {{ productosFiltrados().length }} producto(s)
  </p>
</div>
