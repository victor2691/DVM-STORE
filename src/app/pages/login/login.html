<div class="login-container">
  <div class="login-box">
    <h1>DVM Store Admin</h1>
    <p>Inicia sesión con tus credenciales</p>

    <form (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          placeholder="admin"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
        />
      </div>

      @if (authService.error()) {
        <div class="error-message">
          {{ authService.error() }}
        </div>
      }

      <button type="submit" class="login-btn">
        Iniciar Sesión
      </button>
    </form>

    <p class="hint">Usa: usuario <strong>admin</strong> | contraseña <strong>admin</strong></p>
  </div>
</div>
