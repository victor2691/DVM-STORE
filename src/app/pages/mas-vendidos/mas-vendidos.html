<div class="catalogo">
  <div class="header-catalogo">
    <h1>Más Vendidos</h1>
    <p>Los productos más populares y demandados de nuestro catálogo</p>
  </div>

  <div class="filtros">
    <select [ngModel]="filtroCategoria()" (ngModelChange)="filtroCategoria.set($event)" class="input-filtro">
      <option value="">Todas las categorías</option>
      @for (cat of categoryService.categorias(); track cat.id) {
        <option [value]="cat.id">{{ cat.nombre }}</option>
      }
    </select>
  </div>

  <div class="productos-grid">
    @if (productosFiltrados().length > 0) {
      @for (producto of productosFiltrados(); track producto.id) {
        <app-card-producto-carrito [producto]="producto"></app-card-producto-carrito>
      }
    } @else {
      <div class="sin-resultados">
        <p>No hay productos disponibles con esos filtros</p>
      </div>
    }
  </div>

  <p class="total-productos">
    Mostrando {{ productosFiltrados().length }} producto(s)
  </p>
</div>
