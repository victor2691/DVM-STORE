<mat-toolbar class="header" color="primary">

  <!-- Izquierda -->
  <div class="left" routerLink="/">

   <img
      src="/logofinal.svg"
      alt="DVM Store"
      class="logo"
    />

  </div>

  <!-- Centro -->
  <div class="center">
    <button mat-button routerLink="/catalogo">Productos</button>
    <button mat-button routerLink="/celulares">Celulares</button>
    <button mat-button routerLink="/liquidacion">Liquidación</button>
    <button mat-button routerLink="/mas-vendidos">Más vendidos</button>
  </div>

  <!-- Derecha -->
  <div class="right">
    <button mat-icon-button>
      <mat-icon>search</mat-icon>
    </button>

    <button mat-icon-button routerLink="/carrito">
      <mat-icon>shopping_cart</mat-icon>
    </button>

    @if (authService.estaAutenticadoYActivo()) {
      <!-- Usuario logueado -->
      <span class="user-info">
        {{ authService.usuarioActual()?.username }}
        @if (authService.tieneRol('admin')) {
          <span class="badge-admin">ADMIN</span>
        }
      </span>
      <button mat-icon-button (click)="logout()" title="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    } @else {
      <!-- Usuario no logueado -->
      <button mat-icon-button routerLink="/login" title="Iniciar sesión">
        <mat-icon>account_circle</mat-icon>
      </button>
    }
  </div>

</mat-toolbar>
