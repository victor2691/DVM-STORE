<mat-toolbar class="header" color="primary">

  <!-- Izquierda -->
  <div class="left" routerLink="/">

   <img
      src="/logo_2.svg"
      alt="DVM Store"
      class="logo"
    />

  </div>

  <!-- Centro -->
  <div class="center">
    <button mat-button routerLink="/productos">Productos</button>
    <button mat-button routerLink="/celulares">Celulares</button>
    <button mat-button routerLink="/liquidacion">Liquidación</button>
    <button mat-button routerLink="/mas-vendidos">Más vendidos</button>
  </div>

  <!-- Derecha -->
  <div class="right">
    <button mat-icon-button>
      <mat-icon>search</mat-icon>
    </button>

    <button mat-icon-button routerLink="/carrito">
      <mat-icon>shopping_cart</mat-icon>
    </button>

    <button mat-icon-button routerLink="/login">
      <mat-icon>account_circle</mat-icon>
    </button>
  </div>

</mat-toolbar>
