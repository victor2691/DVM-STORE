<div class="product-card">
  <div class="image-container">
    <img [src]="producto().imagenUrl" [alt]="producto().nombre">
    @if (producto().oferta) {
      <span class="offer-badge">Oferta</span>
    }
  </div>

  <div class="content">
    <span class="category">{{ producto().nombreCategoria }}</span>
    <h3 class="title">{{ producto().nombre }}</h3>

    <div class="footer">
      <span class="price">{{ producto().precio | currency }}</span>

      <button class="add-btn" aria-label="Agregar al carrito">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="21" r="1"></circle>
          <circle cx="19" cy="21" r="1"></circle>
          <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
          <line x1="12" y1="9" x2="12" y2="15"></line>
          <line x1="9" y1="12" x2="15" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>
</div>
