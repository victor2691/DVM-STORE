<mat-card
  class="category-card"
  [style.background-image]="'url(' + category().imagenUrl + ')'"
  [routerLink]="['/categoria', category().id]"
>
  <div class="overlay">
    <h2 class="title">{{ category().nombre }}</h2>
    <p class="description">{{ category().descripcion }}</p>
  </div>
</mat-card>
